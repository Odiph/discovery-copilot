[pytest]
markers =
    live: requires live network credentials (SONIOX_API_KEY / ASSEMBLYAI_API_KEY) or a live network call; deselect with -m "not live" to stay fully offline.
    hardware: requires real Windows audio hardware (a working, unmuted default output device); deselect with -m "not hardware" to skip on a machine without one.
    live_reasoning: requires a real ANTHROPIC_API_KEY and makes a paid call to the reasoning vendor; deselect with -m "not live_reasoning" to stay fully offline and free.
