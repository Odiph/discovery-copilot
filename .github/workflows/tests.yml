name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # Windows only: PyAudioWPatch ships win_amd64 wheels and nothing else.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Python tests (no network, no audio hardware, no paid calls)
        env:
          PYTHONUTF8: "1"
        run: python -m pytest app/tests benchmark/tests -m "not live and not hardware and not live_reasoning" -q
      - name: JS tests
        # One file at a time: the directory form reports a spurious failure on Windows.
        shell: bash
        run: for f in app/tests/js/*.test.mjs; do node --test "$f" || exit 1; done
